# Generated from docs/_system/integrations/github-actions/docs.yml by OttoDoc.
# Do not edit .github/workflows/docs.yml directly.
#
# The line below is the record of which agent platforms are configured. OttoDoc reads
# it back to know what to refresh, verify, and remove; editing it by hand desynchronizes
# the installation and fails the adapter check.
# ottodoc-platforms: {{PLATFORMS}}
name: docs

# The path filters below deliberately cover every supported platform, not only the
# configured ones, so that an adapter belonging to an unconfigured platform still
# triggers the check that reports it as an orphan.
on:
  pull_request:
    paths:
      - 'docs/**'
      - '.claude/agents/doc-*.md'
      - '.claude/skills/doc/**'
      - '.agents/skills/documentation/**'
      - '.codex/agents/doc-*.toml'
      - '.cursor/agents/doc-*.md'
      - '.cursor/rules/documentation.mdc'
      - '.cursor/skills/documentation/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.claude/agents/doc-*.md'
      - '.claude/skills/doc/**'
      - '.agents/skills/documentation/**'
      - '.codex/agents/doc-*.toml'
      - '.cursor/agents/doc-*.md'
      - '.cursor/rules/documentation.mdc'
      - '.cursor/skills/documentation/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify documentation adapters
        shell: pwsh
        run: ./docs/_system/scripts/check-adapters.ps1

      - name: Lint the knowledge tree
        shell: pwsh
        run: ./docs/_system/scripts/lint.ps1

      - name: Verify indexes match regeneration
        shell: pwsh
        run: ./docs/_system/scripts/regen.ps1 -Check
