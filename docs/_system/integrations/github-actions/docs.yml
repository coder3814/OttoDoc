# Generated from docs/_system/integrations/github-actions/docs.yml by OttoDoc.
# Do not edit .github/workflows/docs.yml directly.
name: docs

# The path filters below deliberately cover every supported platform, not only the
# configured ones, so that an adapter belonging to an unconfigured platform still
# triggers the check that reports it as drift.
on:
  pull_request:
    paths:
      - 'docs/**'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
      - '.cursor/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
      - '.cursor/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the documentation system
        shell: pwsh
        run: |
          ./docs/_system/scripts/lint.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./docs/_system/scripts/regen.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./docs/_system/scripts/check-adapters.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
